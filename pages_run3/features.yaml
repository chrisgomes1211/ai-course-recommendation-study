# Feature definitions for experiment documentation
feature_definitions:
  price:
    description: "Whether the course price is transparently displayed, and whether an original/higher price is shown as an anchor"
    levels: ["shown", "hidden"]
  reviews:
    description: "Volume and visibility of student reviews/ratings (counts compressed in run 2 to break the run-1 ceiling effect)"
    levels: ["many", "few", "none"]
  credentials:
    description: "Whether instructor credentials are provided and how detailed"
    levels: ["detailed", "minimal", "none"]
  description:
    description: "Depth and detail of course description and curriculum"
    levels: ["detailed", "short"]
  structure:
    description: "Page organization and clarity of information architecture"
    levels: ["structured", "unstructured"]
  certificate:
    description: "Whether a completion certificate is offered (only one page in run 2)"
    levels: [true, false]
  badge:
    description: "Competitive positioning badge shown on the page (varied per page)"
    levels: ["Best Seller", "Best Value", "Most Reviewed", "New & Trending", "Editor's Choice"]
  social_proof:
    description: "Enrollment count and recency signal (varied per page)"
  comparison_table:
    description: "Five-way comparison table shown on the page (shown on 3 of 5 pages in run 2)"
    levels: [true, false]
  payment_plan:
    description: "Installment payment option offered (varied per page)"
  price_anchoring:
    description: "Whether an original/higher price is displayed next to the real price (run 2 new signal)"
    levels: [true, false]
