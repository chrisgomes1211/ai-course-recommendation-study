# Feature definitions for experiment documentation
feature_definitions:
  price:
    description: "Whether the course price is transparently displayed or hidden behind 'contact for pricing'"
    levels: ["shown", "hidden"]
  reviews:
    description: "Volume and visibility of student reviews/ratings"
    levels: ["many", "few", "none"]
  credentials:
    description: "Whether instructor credentials are provided and how detailed"
    levels: ["detailed", "minimal", "none"]
  description:
    description: "Depth and detail of course description and curriculum"
    levels: ["detailed", "short"]
  structure:
    description: "Page organization and clarity of information architecture"
    levels: ["structured", "unstructured"]