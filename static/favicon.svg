<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AI Course Recommendation Study favicon">
  <defs>
    <linearGradient id="frame" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="8" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#241a3d"/>
      <stop offset="1" stop-color="#120d22"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.4" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ded4ff"/>
    </radialGradient>
    <filter id="bulbGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- face -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#face)" stroke="url(#frame)" stroke-width="4"/>

  <!-- antenna -->
  <path d="M32 18 V12" stroke="#c084fc" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="32" cy="8.8" r="4" fill="#d9ee52" filter="url(#bulbGlow)"/>

  <!-- eyes -->
  <ellipse cx="23" cy="33.5" rx="6.1" ry="7.6" fill="url(#eye)"/>
  <ellipse cx="41" cy="33.5" rx="6.1" ry="7.6" fill="url(#eye)"/>

  <!-- smile -->
  <path d="M24 45.5 Q32 52 40 45.5" fill="none" stroke="#d9ee52" stroke-width="3.8" stroke-linecap="round"/>
</svg>
