name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yamllint

      - name: Check Python syntax
        run: |
          python -m py_compile src/models.py src/run_experiment.py src/estimate_cost.py

      - name: Validate config.yaml syntax
        run: |
          yamllint config.yaml

      - name: Run cost estimator (dry-run)
        run: |
          python -m src.estimate_cost
        env:
          OPENAI_API_KEY: "dummy"
          ANTHROPIC_API_KEY: "dummy"
          GOOGLE_API_KEY: "dummy"

      - name: Verify results directory exists
        run: |
          mkdir -p results
          test -d results