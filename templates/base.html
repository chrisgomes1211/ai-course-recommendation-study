<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Course Recommendation Study{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('acs-theme'); } catch (e) {}
            var theme = (stored === 'win95' || stored === 'studio') ? stored : 'atlantic';
            var pref = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            if (theme === 'studio') { pref = 'light'; }
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-pref', pref);
            var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (theme !== 'win95' && !reduce) {
                document.documentElement.classList.add('js-anim');
            }
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('run_test') }}" class="nav-brand">AI Course Recommendation Study</a>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="{{ url_for('run_test') }}" class="{% if request.endpoint == 'run_test' %}active{% endif %}">Run a Test</a></li>
                    <li><a href="{{ url_for('results') }}" class="{% if request.endpoint == 'results' %}active{% endif %}">Results</a></li>
                </ul>
                <div class="theme-dd">
                    <button type="button" id="theme-dd-btn" class="theme-dd-btn" aria-haspopup="true" aria-expanded="false" aria-controls="theme-dd-menu" aria-label="Switch theme">
                        <svg class="theme-dd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                        </svg>
                        <span class="theme-dd-label">Atlantic</span>
                        <svg class="theme-dd-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
                    </button>
                    <div class="theme-dd-menu" id="theme-dd-menu" role="menu" aria-label="Theme" hidden>
                        <button type="button" class="dd-item" role="menuitemradio" data-theme-val="atlantic" aria-checked="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                            </svg>
                            <span class="dd-text">
                                <span>Atlantic</span>
                                <span class="dd-hint">Follows your system light / dark</span>
                            </span>
                            <svg class="dd-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
                        </button>
                        <button type="button" class="dd-item" role="menuitemradio" data-theme-val="studio" aria-checked="false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M12 2l8 10-8 10-8-10z"></path>
                            </svg>
                            <span class="dd-text">
                                <span>Studio</span>
                                <span class="dd-hint">Modern research UI</span>
                            </span>
                            <svg class="dd-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
                        </button>
                        <button type="button" class="dd-item" role="menuitemradio" data-theme-val="win95" aria-checked="false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                                <path d="M8 21h8M12 17v4"></path>
                            </svg>
                            <span class="dd-text">
                                <span>Windows 95</span>
                                <span class="dd-hint">Retro desktop mode</span>
                            </span>
                            <svg class="dd-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>MSc Research Experiment — Local Web Interface</p>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
