{# Shared floating dock — include on every page. Requires dock.css + dock.js. #}
<nav class="dock" id="dock" aria-label="Quick dock">
    <a class="dock-item{% if request.endpoint == 'run_test' %} is-active{% endif %}" href="{{ url_for('run_test') }}">
        <span class="dock-ico dock-ico--bot"><img src="{{ url_for('static', filename='favicon.svg') }}" alt=""></span>
        <span class="dock-tip">Home</span>
        <span class="dock-dot" aria-hidden="true"></span>
    </a>
    <a class="dock-item" href="{{ url_for('run_test') }}#single-run">
        <span class="dock-ico dock-ico--run">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
        </span>
        <span class="dock-tip">Run a test</span>
        <span class="dock-dot" aria-hidden="true"></span>
    </a>
    <a class="dock-item{% if request.endpoint == 'pages_index' %} is-active{% endif %}" href="{{ url_for('pages_index') }}">
        <span class="dock-ico dock-ico--pages">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.7 0 2-1.3 1.2-2.2-.8-1 .1-2.3 1.3-2.3H16a5 5 0 0 0 5-5c0-4.4-4-8.5-9-8.5z"/><circle cx="7.5" cy="10.5" r="1.1" fill="#fff" stroke="none"/><circle cx="10.5" cy="7" r="1.1" fill="#fff" stroke="none"/><circle cx="15" cy="7.5" r="1.1" fill="#fff" stroke="none"/></svg>
        </span>
        <span class="dock-tip">Course pages</span>
        <span class="dock-dot" aria-hidden="true"></span>
    </a>
    <a class="dock-item{% if request.endpoint == 'results' %} is-active{% endif %}" href="{{ url_for('results') }}">
        <span class="dock-ico dock-ico--chart">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
        </span>
        <span class="dock-tip">Results</span>
        <span class="dock-dot" aria-hidden="true"></span>
    </a>
    <a class="dock-item{% if request.endpoint == 'report' %} is-active{% endif %}" href="{{ url_for('report') }}">
        <span class="dock-ico dock-ico--report">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg>
        </span>
        <span class="dock-tip">Report</span>
        <span class="dock-dot" aria-hidden="true"></span>
    </a>
    <a class="dock-item{% if request.endpoint == 'about' %} is-active{% endif %}" href="{{ url_for('about') }}">
        <span class="dock-ico dock-ico--about">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        </span>
        <span class="dock-tip">About</span>
        <span class="dock-dot" aria-hidden="true"></span>
    </a>
</nav>
