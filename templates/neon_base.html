<!DOCTYPE html>
<html lang="en" data-skin="neon">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Course Recommendation Study{% endblock %}</title>
    <meta name="description" content="MSc research experiment: how do AI models choose between competing online course providers?">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-neon-32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-neon-16.png') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="48x48">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon-neon-180.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='neon.css') }}">
</head>
<body>
    <div class="neon-field" aria-hidden="true"></div>
    <div class="neon-dots" aria-hidden="true"></div>

    <nav class="neon-nav">
        <div class="neon-nav-inner">
            <a href="{{ url_for('run_test') }}" class="neon-brand">
                <span class="neon-brand-mark"><img src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="18" height="18"></span>
                <span>AI Course Recommendation Study</span>
            </a>
            <ul class="neon-links">
                <li><a href="{{ url_for('run_test') }}" class="{% if request.endpoint == 'run_test' %}is-active{% endif %}">Run a Test</a></li>
                <li><a href="{{ url_for('results') }}" class="{% if request.endpoint == 'results' %}is-active{% endif %}">Results</a></li>
                <li><a href="{{ url_for('about') }}" class="{% if request.endpoint == 'about' %}is-active{% endif %}">About</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="neon-footer">
        <p>MSc Research Experiment — <a href="{{ url_for('classic') }}">Classic UI</a></p>
    </footer>

    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script src="{{ url_for('static', filename='neon.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
