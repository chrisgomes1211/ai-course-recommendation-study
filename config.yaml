# Final dataset model set: low tier only, ~2 per company (supervisor direction 2026-10-09)
# Anthropic dropped 2026-10-10: only low-tier Haiku was 10x price outlier + account out of credit
models:
  # OpenAI
  - name: gpt-6-luna
    provider: openai
    tier: low
  - name: gpt-4.1-mini
    provider: openai
    tier: low

  # Google
  - name: gemini-3.1-flash-lite
    provider: google
    tier: low
  - name: gemini-3.8-flash
    provider: google
    tier: low

  # xAI
  - name: grok-3-mini
    provider: xai
    tier: low

  # Xiaomi
  - name: mimo-v2.6-flash
    provider: xiaomi
    tier: low

# 6 models x 5 pages x 34 runs = 1,020 rows
runs_per_condition: 34
budget_cap_usd: 100.0

# USER MUST VERIFY against current provider pricing
pricing:
  # OpenAI
  gpt-4.1-mini: {input: 0.15, output: 0.60}
  # GPT-6 (verified Oct 2026)
  gpt-6-luna: {input: 0.10, output: 0.50}

  # Google (verified Oct 2026)
  gemini-3.1-flash-lite: {input: 0.25, output: 1.50}
  gemini-3.8-flash: {input: 0.75, output: 3.75}

  # xAI
  grok-3-mini: {input: 0.30, output: 1.50}

  # Xiaomi (verified Oct 2026 from platform.xiaomimimo.com overseas pricing)
  mimo-v2.6-flash: {input: 0.14, output: 0.28}

# Token measurement assumptions for cost estimator (measured from pilot runs Oct 2026)
avg_prompt_tokens: 42000
avg_completion_tokens_choice: 840
avg_completion_tokens_interview: 140